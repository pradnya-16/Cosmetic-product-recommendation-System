<!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #9fb4ff;">
        <div class="container-fluid">

 <!--Form-->
 <form action="" method="post" class="form">
    <h1>Sign-Up</h1>
    <div class="form-item">
      <h5>First Name</h5>
      <input
        type="name"
        class="form-control"
        id="inputFirstName"
        placeholder="Enter Your First Name"
        name="firstname"
        required
      />

      <h5 class="form-name">Last Name</h5>
      <input
        type="name"
        class="form-control"
        id="inputLastName"
        placeholder="Enter Your Last Name"
        name="lastname"
        required
      />

      <h5>Email</h5>
      <input
        type="email"
        class="form-control"
        id="inputEmail"
        placeholder="Enter Your Email"
        name="email"
        required
      />

      <h5>Password</h5>
      <input
        type="password"
        class="form-control"
        id="inputPassword"
        placeholder="Enter Password"
        name="password"
        required
      />
    </div>

    <div class="Sign-in-button">
      <button
        type="submit"
        value="Submit"
        name="submitDetails"
        id="submitDetails"
        class="btn btn-primary"
        style="background-color: darkblue"
      >
       <a href="upload.html" style="color: white;">Sign Up</a>
      </button>
    </div>
    <a
      href="sign-in.html"
      class="login"
      style="padding-left: 130px; color: darkblue"
      >Already have an account? Sign-In</a
    >
  </form>

  <!-- Option 1: Bootstrap Bundle with Popper -->

  ></script>
</body>
</html>
